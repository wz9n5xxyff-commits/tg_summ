name: Telegram Auto Digest

on:
  schedule:
    # Run every Sunday at 18:00 UTC (21:00 MSK)
    - cron: '0 18 * * 0'
  workflow_dispatch: # Allows manual triggering from GitHub UI
    inputs:
      is_test:
        description: "Publish to the TEST channel instead of the main one"
        type: boolean
        default: true

permissions:
  contents: write # needed to commit alice/digest.json

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Auto Digest Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        TG_TEST_CHANNEL_ID: ${{ secrets.TG_TEST_CHANNEL_ID }}
        GEMINI_MODEL: ${{ vars.GEMINI_MODEL }} # optional repo variable to switch the model
        # Scheduled runs publish to the main channel; manual runs follow the checkbox
        IS_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.is_test && 'true' || 'false' }}
      run: python main.py

    - name: Save digest for Alice skill
      if: always()
      run: |
        if [ -f alice/digest.json ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alice/digest.json
          git diff --cached --quiet || git commit -m "Update Alice digest"
          git push
        fi
